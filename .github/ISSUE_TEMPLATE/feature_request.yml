name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Note: gaslamp is deliberately minimal — a thin, symmetric wrapper around
        `claude -p` / `codex exec`, where the symmetry between the two consult
        directions is the whole design. New surface area won't land without a
        strong reason; bug fixes, ergonomics, and docs are much more likely. See
        CONTRIBUTING.md.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that gaslamp doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work? A CLI sketch or tool-call example is welcome.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface does this touch?
      options:
        - consult engine (sandbox mapping, auth, session/resume, signals)
        - fleet (fan-out, concurrency, manifest)
        - CLI subcommand (jobs / poll / setup / new)
        - docs only
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
