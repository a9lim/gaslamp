name: Bug report
description: A consult hung, crashed, or behaved wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if a consult refuses immediately from a sandboxed **Codex**,
        network is likely disabled in the sandbox (`CODEX_SANDBOX_NETWORK_DISABLED=1`)
        — re-run with network access (see the README). Re-run with `GASLAMP_DEBUG=1`
        for the spawn argv, and grab the job id from the trailer.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you get?
    validations:
      required: true

  - type: input
    id: gaslamp-version
    attributes:
      label: gaslamp version
      description: Output of `gaslamp --version`
      placeholder: 2.0.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.0.0
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: Which direction?
      options:
        - Codex → Claude (`gaslamp claude …`)
        - Claude → Codex (`gaslamp codex …`)
        - fleet (`gaslamp fleet …`)
        - setup
        - not sure
    validations:
      required: true

  - type: input
    id: job-id
    attributes:
      label: Job id
      description: The `job:` id from the trailer, if you have one (records live under `~/.gaslamp/jobs/<id>/`).

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The shortest tool call or command sequence that reproduces it. Please don't paste secrets.
      render: shell
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Transcript / debug log
      description: Relevant lines from `~/.gaslamp/jobs/<id>/stderr.log` (or `events.jsonl`), or stderr with `GASLAMP_DEBUG=1`.
      render: shell
